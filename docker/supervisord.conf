[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:xvfb]
priority=10
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -ac -nolisten tcp
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
priority=20
command=/usr/bin/openbox-session
environment=DISPLAY=":99",HOME="/root"
autorestart=true
startretries=20
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
priority=30
command=/usr/bin/x11vnc -display :99 -localhost -forever -shared -rfbport 5900 -nopw -noxdamage -quiet
environment=DISPLAY=":99",HOME="/root"
autorestart=true
startretries=20
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:websockify]
priority=40
command=/usr/bin/websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:node]
priority=50
directory=/app
command=/usr/local/bin/node src/server.js
environment=DISPLAY=":99",HOME="/root"
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
priority=60
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startsecs=1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
